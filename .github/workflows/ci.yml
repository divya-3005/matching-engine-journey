name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test, Fuzz & Benchmark
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Check Formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Unformatted Go code found:"
            gofmt -l .
            exit 1
          fi

      - name: Verify Dependencies
        run: go mod verify

      - name: Build Binary
        run: go build -v ./...

      - name: Run Unit Tests with Race Detector
        run: go test -v -race ./...

      - name: Run Latency Distribution Profiling
        run: go test -v -run TestOrderLatencyDistribution ./engine

      - name: Run Invariant Fuzz Testing (5s)
        run: go test -fuzz=FuzzOrderMatchingInvariants -fuzztime=5s ./engine

      - name: Run Engine Benchmarks
        run: go test -bench=. -benchmem -run=^$ ./...
